# user nginx;
worker_processes 1;
env S3_ENDPOINT;
env S3_BUCKET;
env S3_PREFIX;
env S3_ACCESS_KEY;
env S3_SECRET_KEY;
env S3_REGION;
env CROWDSEC_APPSEC_KEY;
env CROWDSEC_APPSEC_URL;
error_log /dev/stderr;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format json_combined escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request_id":"$request_id",'
        '"request":"$request",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status": $status,'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    sendfile                 on;
    tcp_nopush               on;
    tcp_nodelay              on;
    keepalive_timeout        600s;
    types_hash_max_size      2048;
    include                  /usr/local/openresty/nginx/conf/mime.types;
    default_type             application/octet-stream;
    resolver                 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout         1s;

    gzip                     on;
    gzip_proxied             off;
    gzip_disable             "msie6";
    gzip_vary                on;
    gzip_comp_level          6;
    gzip_min_length          256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    client_max_body_size     1000g;
    client_body_buffer_size  16k;
    proxy_read_timeout       600s;
    proxy_connect_timeout    60s;
    proxy_send_timeout       600s;
    send_timeout             600s;
    uwsgi_read_timeout       600s;
    uwsgi_connect_timeout    600s;
    uwsgi_send_timeout       600s;

    map $http_user_agent $ua_sane {
    default $http_user_agent;
    "~[\r\n]" "bad_ua";
    }

    map $http_referer $ref_sane {
    default $http_referer;
    "~[\r\n]" "bad_referer";
    }

    map $http_x_forwarded_for $xff_sane {
    default $http_x_forwarded_for;
    "~[\r\n]" "bad_xff";
    }

    map $http_user_agent $is_bot {
        default 0;
        "~*(CCBot|Googlebot-Images|Sogou|SenutoBot|SiteScoreBot|Twitterbot|YisouSpider|IABot|Turnitin|
        CFNetwork/.* Darwin|ClaudeBot|SemrushBot|Googlebot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Sogou|Exabot|
        facebot|facebookexternalhit|Bytespider|AppleBot|Swiftbot|Slurp Bot|CCBot|GoogleOther|Google-InspectionTool|
        MJ12bot|Alexa crawler|Soso Spider|Pinterestbot|Dotbot|AhrefsBot|archive.org_bot|scrapy|PetalBot|
        SemrushBot|Amazonbot|DataForSeoBot|crawl-66-249-66-200.googlebot.com|rdap.arin.net|meta-externalagent)" 1;
        # Python HTTP libraries (scrapers)
        "~*(python-requests|python-urllib|httpx|aiohttp)" 1;
        # Go/Node.js/Dart HTTP clients (scrapers)
        "~*(Go-http-client|axios/|Dart/)" 1;
        # GardenSketchBot (33.5 GB bandwidth abuse)
        "~*GardenSketchBot" 1;
        # ML training data scrapers
        "~*(PlantTrainingDataCollector|PlantRobot-Dataset|PlantDatasetBuilder|BioCLIP|NicheForge)" 1;
        # Self-identified crawlers
        "~*\(compatible;\s*crawler\)" 1;
        # Bare "Mozilla/5.0" with no engine details — real browsers always include more
        "~^Mozilla/5\.0$" 1;
        # AWS scraper farm signature (26 IPs, Firefox/72 spoofing)
        "~*Firefox/72\.0" 1;
        # Obsolete IE versions (NCATS scanner pattern, general bots)
        "~*MSIE\s[5-8]\.0" 1;
        # Ancient Android (<=4.x) — almost always bots
        "~*Android\s[1-4]\." 1;
    }

    geo $limit_bot {
        default 1;
        10.0.0.0/8 0;
        172.16.0.0/12 0;
        192.168.0.0/16 0;
    }

    map "$is_bot:$limit_bot" $block_bot {
        "1:1" 1;
        default 0;
    }

    geo $is_blocked_ip {
        default 0;
        47.76.0.0/16 1;
        66.249.66.200 1;
        52.224.0.0/11 1;
        13.200.0.0/13 1;
        36.110.0.0/16 1;
        106.36.0.0/15 1;
        188.166.224.0/20 1;
        # DigitalOcean ranges (bot/scraper farms)
        134.122.0.0/15 1;
        137.184.0.0/14 1;
        142.93.0.0/16 1;
        143.198.0.0/15 1;
        143.244.0.0/16 1;
        146.190.0.0/15 1;
        147.182.0.0/15 1;
        157.230.0.0/15 1;
        157.245.0.0/16 1;
        159.65.0.0/16 1;
        159.89.0.0/16 1;
        159.203.0.0/16 1;
        159.223.0.0/16 1;
        161.35.0.0/16 1;
        162.243.0.0/16 1;
        164.90.0.0/16 1;
        165.22.0.0/15 1;
        165.227.0.0/16 1;
        167.71.0.0/16 1;
        167.99.0.0/16 1;
        167.172.0.0/16 1;
        174.138.0.0/16 1;
        178.128.0.0/16 1;
        178.62.0.0/16 1;
        192.241.0.0/16 1;
        198.199.0.0/16 1;
        206.189.0.0/16 1;
        206.81.0.0/16 1;
        # Frontier/SNET persistent scraper (194K blocked reqs, still hammering)
        32.220.168.0/21 1;

        # Malta python-requests scraper (305 GB bandwidth abuse)
        195.158.111.90 1;

        # Packethub S.A. (Panama hosting/VPN, 76.5 GB)
        193.43.135.0/24 1;

        # AWS us-east-2 scraper farm (26 IPs, Firefox/72 spoofing)
        3.128.0.0/9 1;
        18.116.0.0/14 1;
        18.188.0.0/14 1;
        18.216.0.0/14 1;
        18.220.0.0/14 1;

        # Linode/Akamai (rate-limit abuser)
        45.79.0.0/16 1;

        # IP Volume Netherlands (scanner)
        89.248.168.0/24 1;

        # Google Cloud scraper ranges
        34.64.0.0/10 1;
        8.34.208.0/20 1;

        # OVH datacenter scraper farm (Chrome/139.0.0.0 spoofing, no referer)
        57.129.0.0/16 1;
        141.94.0.0/16 1;
        51.77.0.0/16 1;
    }

    geo $limited {
        default 1;
        10.0.0.0/8 0;
        172.16.0.0/12 0;
        192.168.0.0/16 0;
        130.225.43.0/24 0;
        206.207.50.146 0;
    }

    # Identify Danish partners (GBIF) for Thumbor whitelist
    geo $is_danish_partner {
        default 0;
        130.225.43.0/24 1;
    }

    # Whitelist Thumbor user-agent for Danish partners only
    map "$http_user_agent:$is_danish_partner" $thumbor_whitelist {
        default 0;
        "~*Thumbor.*:1" 1;
    }

    map $http_origin $cors_header {
        default "";
        # CCH2 - all variations
        "~^https?://(www\.)?cch2\.org" "https://cch2.org";
        # Bryophyte portal
        "~^https?://(www\.)?bryophyteportal\.org" "https://bryophyteportal.org";
        # Lichen portal
        "~^https?://(www\.)?lichenportal\.org" "https://lichenportal.org";
        # Big Bee
        "~^https?://library\.big-bee\.net" "https://library.big-bee.net";
        # GBIF
        "~^https?://(api|scientific-collections)\.gbif\.org" "https://gbif.org";
        # Calflora
        # Specify 7 — one entry per collection subdomain
        "~^http://botany\.specify\.calacademy\.org" "http://botany.specify.calacademy.org";
        "~^https://botany\.specify\.calacademy\.org" "https://botany.specify.calacademy.org";
        "~^http://iz\.specify\.calacademy\.org" "http://iz.specify.calacademy.org";
        "~^https://iz\.specify\.calacademy\.org" "https://iz.specify.calacademy.org";
        "~^http://ich\.specify\.calacademy\.org" "http://ich.specify.calacademy.org";
        "~^https://ich\.specify\.calacademy\.org" "https://ich.specify.calacademy.org";
        "~^http://om\.specify\.calacademy\.org" "http://om.specify.calacademy.org";
        "~^https://om\.specify\.calacademy\.org" "https://om.specify.calacademy.org";
        "~^http://herp\.specify\.calacademy\.org" "http://herp.specify.calacademy.org";
        "~^https://herp\.specify\.calacademy\.org" "https://herp.specify.calacademy.org";
        "~^http://geo\.specify\.calacademy\.org" "http://geo.specify.calacademy.org";
        "~^https://geo\.specify\.calacademy\.org" "https://geo.specify.calacademy.org";
        # Collections Explorer
        "~^https?://collections\.calacademy\.org" "https://collections.calacademy.org";
        "~^https?://(www\.)?calflora\.org" "https://calflora.org";
    }

    map "$cors_header:$limited" $final_limit {
        ":1" $binary_remote_addr;
        ":0" "";
        default "";
    }

    # Full-size rate limit key: exempt thumbnails, use $final_limit for everything else.
    # $final_limit is already empty for internal IPs and whitelisted referers.
    map $arg_type $fullsize_limit {
        "T"     "";
        default $final_limit;
    }

    # Thumbnail zone: 120 req/min per IP, burst 120 (thumbnails fully exempt)
    # Thumbnails bypass all rate limiting (empty key via $fullsize_limit)
    limit_req_zone $fullsize_limit zone=thumb_zone:10m rate=120r/m;

    # Full-size zone: stricter (10 req/min per IP, burst 5)
    # Only applies to non-thumbnail requests (key is "" for thumbnails)
    limit_req_zone $fullsize_limit zone=fullsize_zone:10m rate=10r/m;


    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    server {
       listen 80 default_server;
       server_name _;
       return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        uwsgi_buffer_size 128k;
        uwsgi_buffers 4 256k;
        uwsgi_busy_buffers_size 256k;
        ssl_certificate /etc/ssl/certs/wildcard_calacademy_org.pem;
        ssl_certificate_key /etc/ssl/private/wildcard_calacademy_org.key;

        # Decode HTML-encoded ampersands in query strings (&amp; → &)
        # Some clients (crawlers, double-encoded links) send &amp; literally.
        rewrite_by_lua_block {
            local args = ngx.var.args
            if args and args:find("&amp;", 1, true) then
                ngx.req.set_uri_args((args:gsub("&amp;", "&")))
            end
        }

        # Override botblocker for whitelisted Thumbor (Danish partners)
        if ($thumbor_whitelist) {
            set $bad_bot '0';
        }

        # Always allow /robots.txt — crawlers must be able to read disallow rules
        if ($request_uri ~ ^/robots\.txt) {
            set $bad_bot '0';
            set $bad_words '0';
            set $bad_referer '0';
            set $validate_client '0';
            set $block_bot '0';
            set $is_blocked_ip '0';
        }


        if ($block_bot) {
            return 403;
        }

        if ($is_blocked_ip) {
            return 403;
        }

        # Custom error pages for blocked and rate-limited requests
        error_page 403 /403.html;
        error_page 503 /503.html;

        location = /403.html {
            internal;
            root /srv/app/views;
        }

        location = /503.html {
            internal;
            root /srv/app/views;
        }

        location = /robots.txt {
            default_type text/plain;
            add_header Cache-Control "max-age=3600, public";
            alias /srv/app/views/robots.txt;
        }

        # ------------------------------------------------------------
        # OpenResty S3 acceleration internal location (NEW)
        # Bottle returns: X-Accel-Redirect: /_s3_internal/<bucket>/<key>?dn=...
        # Nginx signs request to MinIO (SigV4 via Lua) and streams bytes directly.
        # ------------------------------------------------------------
        location ~ ^/_s3_internal/(?<bucket>[^/]+)/(?<key>.*)$ {
            internal;

            # Expose captured vars to Lua signer
            set $s3_bucket $bucket;
            set $s3_key    $key;

            # MinIO endpoint (match your S3_ENDPOINT host/port)
            set $s3_scheme https;
            set $s3_host   ibss-gateway.calacademy.org;
            set $s3_port   9000;

            # Signing region
            set $s3_region us-east-1;

            # Content-Disposition defaults; Bottle currently passes dn=... only.
            set $disp inline;
            if ($arg_disp != "") { set $disp $arg_disp; }
            if ($arg_dn != "") {
                add_header Content-Disposition "$disp; filename=\"$arg_dn\"";
            }

            # Proxy settings for large files
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_ssl_server_name on;
            proxy_ssl_verify off;

            # SigV4 signing for MinIO
            access_by_lua_file /usr/local/openresty/nginx/lua/s3_sign.lua;


            # Override Content-Type based on file extension (MinIO stores as binary/octet-stream)
            header_filter_by_lua_block {
                local key = ngx.var.key or ""
                local ext = key:match("%.([^%.]+)$")
                if ext then
                    ext = ext:lower()
                    local types = {
                        jpg  = "image/jpeg",
                        jpeg = "image/jpeg",
                        png  = "image/png",
                        gif  = "image/gif",
                        tif  = "image/tiff",
                        tiff = "image/tiff",
                        pdf  = "application/pdf",
                    }
                    if types[ext] then
                        ngx.header["Content-Type"] = types[ext]
                    end
                end
            }

            # Do not forward dn/disp query args to MinIO
            proxy_pass $s3_scheme://$s3_host:$s3_port/$bucket/$key;
        }

        location / {
            # --- CrowdSec AppSec (in-band WAF, FAIL-OPEN) via lua ---
            # openresty auth_request drops sub-request headers, so call AppSec in lua
            # with explicit headers. Only an explicit 403 blocks; any error/timeout
            # allows the request (fail-open) so AppSec can never take the site down.
            access_by_lua_block {
                local httpc = require("resty.http").new()
                httpc:set_timeout(3000)
                local res = httpc:request_uri((os.getenv("CROWDSEC_APPSEC_URL") or "http://172.18.0.1:7422/"), {
                    method = "GET",
                    headers = {
                        ["X-Crowdsec-Appsec-Api-Key"] = (os.getenv("CROWDSEC_APPSEC_KEY") or ""),
                        ["X-Crowdsec-Appsec-Ip"]   = ngx.var.remote_addr,
                        ["X-Crowdsec-Appsec-Host"] = ngx.var.host,
                        ["X-Crowdsec-Appsec-Uri"]  = ngx.var.request_uri,
                        ["X-Crowdsec-Appsec-Verb"] = ngx.var.request_method,
                    },
                })
                if res and res.status == 403 then
                    return ngx.exit(403)
                end
            }
            add_header 'Access-Control-Allow-Origin' $cors_header always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            # Two-zone rate limiting: thumbnails get generous limits,
            # full-size images get stricter limits.
            # Both zones apply to every request; thumbnails have an empty key
            # in fullsize_zone so they're only governed by thumb_zone.
            limit_req zone=thumb_zone burst=120 nodelay;
            limit_req zone=fullsize_zone burst=5 nodelay;

            try_files $uri @image-server;
        }

        location @image-server {
            uwsgi_pass image-server:29000;
            include /usr/local/openresty/nginx/conf/uwsgi_params;
            uwsgi_param Host $host;
            uwsgi_param X-Real-IP $remote_addr;
            uwsgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
            uwsgi_param X-Forwarded-Proto $http_x_forwarded_proto;
            uwsgi_param X-Request-Id $request_id;

            # Allow Bottle to trigger internal redirects (NEW)
            uwsgi_pass_header X-Accel-Redirect;
            uwsgi_pass_header Content-Disposition;
            uwsgi_pass_header Content-Type;
        }
    }
}
