# user nginx;
worker_processes 1;
env S3_ENDPOINT;
env S3_BUCKET;
env S3_PREFIX;
env S3_ACCESS_KEY;
env S3_SECRET_KEY;
env S3_REGION;
env CROWDSEC_APPSEC_KEY;
env CROWDSEC_APPSEC_URL;
error_log /dev/stderr;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format json_combined escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request_id":"$request_id",'
        '"request":"$request",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status": $status,'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"conn":"$connection",'
        '"tls_fp":"$cas_tlsfp"'
    '}';

    # Scraper defences (maps/geos) -- ansible-owned, see role
    # image-server-defences. Do not inline these back into this file.
    include /usr/local/openresty/nginx/conf/cas-security/cas-security-http.conf;

    sendfile                 on;
    tcp_nopush               on;
    tcp_nodelay              on;
    keepalive_timeout        600s;
    types_hash_max_size      2048;
    include                  /usr/local/openresty/nginx/conf/mime.types;
    default_type             application/octet-stream;
    resolver                 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout         1s;

    gzip                     on;
    gzip_proxied             off;
    gzip_disable             "msie6";
    gzip_vary                on;
    gzip_comp_level          6;
    gzip_min_length          256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    client_max_body_size     1000g;
    client_body_buffer_size  16k;
    proxy_read_timeout       600s;
    proxy_connect_timeout    60s;
    proxy_send_timeout       600s;
    send_timeout             600s;
    uwsgi_read_timeout       600s;
    uwsgi_connect_timeout    600s;
    uwsgi_send_timeout       600s;

    map $http_user_agent $ua_sane {
    default $http_user_agent;
    "~[\r\n]" "bad_ua";
    }

    map $http_referer $ref_sane {
    default $http_referer;
    "~[\r\n]" "bad_referer";
    }

    map $http_x_forwarded_for $xff_sane {
    default $http_x_forwarded_for;
    "~[\r\n]" "bad_xff";
    }


    geo $limited {
        default 1;
        10.0.0.0/8 0;
        172.16.0.0/12 0;
        192.168.0.0/16 0;
        130.225.43.0/24 0;
        206.207.50.146 0;
    }

    # Identify Danish partners (GBIF) for Thumbor whitelist
    geo $is_danish_partner {
        default 0;
        130.225.43.0/24 1;
    }

    # Whitelist Thumbor user-agent for Danish partners only
    map "$http_user_agent:$is_danish_partner" $thumbor_whitelist {
        default 0;
        "~*Thumbor.*:1" 1;
    }

    map $http_origin $cors_header {
        default "";
        # CCH2 - all variations
        "~^https?://(www\.)?cch2\.org" "https://cch2.org";
        # Bryophyte portal
        "~^https?://(www\.)?bryophyteportal\.org" "https://bryophyteportal.org";
        # Lichen portal
        "~^https?://(www\.)?lichenportal\.org" "https://lichenportal.org";
        # Big Bee
        "~^https?://library\.big-bee\.net" "https://library.big-bee.net";
        # GBIF
        "~^https?://(api|scientific-collections)\.gbif\.org" "https://gbif.org";
        # Calflora
        # Specify 7 — one entry per collection subdomain
        "~^http://botany\.specify\.calacademy\.org" "http://botany.specify.calacademy.org";
        "~^https://botany\.specify\.calacademy\.org" "https://botany.specify.calacademy.org";
        "~^http://iz\.specify\.calacademy\.org" "http://iz.specify.calacademy.org";
        "~^https://iz\.specify\.calacademy\.org" "https://iz.specify.calacademy.org";
        "~^http://ich\.specify\.calacademy\.org" "http://ich.specify.calacademy.org";
        "~^https://ich\.specify\.calacademy\.org" "https://ich.specify.calacademy.org";
        "~^http://om\.specify\.calacademy\.org" "http://om.specify.calacademy.org";
        "~^https://om\.specify\.calacademy\.org" "https://om.specify.calacademy.org";
        "~^http://herp\.specify\.calacademy\.org" "http://herp.specify.calacademy.org";
        "~^https://herp\.specify\.calacademy\.org" "https://herp.specify.calacademy.org";
        "~^http://geo\.specify\.calacademy\.org" "http://geo.specify.calacademy.org";
        "~^https://geo\.specify\.calacademy\.org" "https://geo.specify.calacademy.org";
        # Collections Explorer
        "~^https?://collections\.calacademy\.org" "https://collections.calacademy.org";
        "~^https?://(www\.)?calflora\.org" "https://calflora.org";
    }

    map "$cors_header:$limited" $final_limit {
        ":1" $binary_remote_addr;
        ":0" "";
        default "";
    }

    # Full-size rate limit key: exempt thumbnails, use $final_limit for everything else.
    # $final_limit is already empty for internal IPs and whitelisted referers.
    map $arg_type $fullsize_limit {
        "T"     "";
        default $final_limit;
    }

    # Thumbnail rate-limit key: thumbnails keyed per-IP, everything else exempt
    # from THIS zone (it is governed by fullsize_zone instead).
    # Fixed 2026-08-02: previously keyed on $fullsize_limit, which is "" for
    # type=T -- an empty key disables limit_req, so this zone was dead code and
    # thumbnails were entirely unlimited.
    map $arg_type $thumb_limit {
        "T"     $final_limit;
        default "";
    }

    # Thumbnail zone: 120 req/min per IP, burst 120
    limit_req_zone $thumb_limit zone=thumb_zone:10m rate=120r/m;

    # Full-size zone: stricter (10 req/min per IP, burst 5)
    # Only applies to non-thumbnail requests (key is "" for thumbnails)
    limit_req_zone $fullsize_limit zone=fullsize_zone:10m rate=10r/m;


    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    server {
       listen 80 default_server;
       server_name _;
       return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;

        # Scraper defences (handshake fingerprint + 403 gates) -- ansible-owned,
        # see role image-server-defences. ORDER-SENSITIVE, keep this include
        # before any other rewrite-phase directive that depends on $cas_tlsfp.
        include /usr/local/openresty/nginx/conf/cas-security/cas-security-server.conf;
        server_name _;

        uwsgi_buffer_size 128k;
        uwsgi_buffers 4 256k;
        uwsgi_busy_buffers_size 256k;
        ssl_certificate /etc/ssl/certs/wildcard_calacademy_org.pem;
        ssl_certificate_key /etc/ssl/private/wildcard_calacademy_org.key;
        # BEGIN ANSIBLE MANAGED cas-wellknown-notice
# Managed by ansible (crowdsec-client role) — RFC 9116 security.txt + access
# policy for blocked-by-default automated clients (datacenter feed, AI crawlers).
# Expires snaps to 90-day buckets so weekly runs stay changed=0 between quarters.
location = /.well-known/security.txt {
    default_type text/plain;
    return 200 "# California Academy of Sciences — Scientific Computing\nContact: mailto:jrussack@calacademy.org\nExpires: 2027-06-05T00:00:00Z\nPolicy: https://ibss-images.calacademy.org/access-policy.txt\nPreferred-Languages: en\n";
}
location = /access-policy.txt {
    default_type text/plain;
    return 200 "California Academy of Sciences — Collections Web Services\nAccess policy for automated and bulk clients\n=============================================================\n\nConnections from datacenter, cloud-hosting, and VPN address space\nare blocked by default on this and related calacademy.org research\nservices. This measure exists because of sustained bulk-scraping\nfrom rotating cloud servers, which has degraded service for\nresearchers and the public.\n\nIf you are operating a legitimate service from cloud infrastructure\nand need access, email jrussack@calacademy.org with:\n\n  - the IP address(es) or CIDR range(s) your service uses\n  - your organization and the purpose of the access\n  - which endpoints you need and your expected request rate\n\nApproved ranges are added to a standing allowlist, typically within\na few business days.\n\nBefore requesting access, note that most bulk-data needs are already\nserved without scraping:\n\n  - Specimen occurrence records and images are published to GBIF\n    (https://www.gbif.org/publisher/search?q=california%20academy)\n    as Darwin Core Archives — complete, versioned, citable.\n  - Fish taxonomy: Eschmeyer's Catalog of Fishes at\n    https://researcharchive.calacademy.org/\n\nAI/LLM training crawlers: see robots.txt. Crawling for model\ntraining is not permitted without prior written arrangement via\nthe same contact.\n";
}
        # END ANSIBLE MANAGED cas-wellknown-notice

        # Decode HTML-encoded ampersands in query strings (&amp; → &)
        # Some clients (crawlers, double-encoded links) send &amp; literally.

        rewrite_by_lua_block {
            local args = ngx.var.args
            if args and args:find("&amp;", 1, true) then
                ngx.req.set_uri_args((args:gsub("&amp;", "&")))
            end
        }


        # Custom error pages for blocked and rate-limited requests
        error_page 403 /403.html;
        error_page 503 /503.html;

        location = /403.html {
            internal;
            root /srv/app/views;
        }

        location = /503.html {
            internal;
            root /srv/app/views;
        }

        location = /robots.txt {
            default_type text/plain;
            add_header Cache-Control "max-age=3600, public";
            alias /srv/app/views/robots.txt;
        }

        # ------------------------------------------------------------
        # OpenResty S3 acceleration internal location (NEW)
        # Bottle returns: X-Accel-Redirect: /_s3_internal/<bucket>/<key>?dn=...
        # Nginx signs request to MinIO (SigV4 via Lua) and streams bytes directly.
        # ------------------------------------------------------------
        location ~ ^/_s3_internal/(?<bucket>[^/]+)/(?<key>.*)$ {
            internal;

            # Expose captured vars to Lua signer
            set $s3_bucket $bucket;
            set $s3_key    $key;

            # MinIO endpoint (match your S3_ENDPOINT host/port)
            set $s3_scheme https;
            set $s3_host   ibss-gateway.calacademy.org;
            set $s3_port   9000;

            # Signing region
            set $s3_region us-east-1;

            # Content-Disposition defaults; Bottle currently passes dn=... only.
            set $disp inline;
            if ($arg_disp != "") { set $disp $arg_disp; }
            if ($arg_dn != "") {
                add_header Content-Disposition "$disp; filename=\"$arg_dn\"";
            }

            # Proxy settings for large files
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_ssl_server_name on;
            proxy_ssl_verify off;

            # SigV4 signing for MinIO
            access_by_lua_file /usr/local/openresty/nginx/lua/s3_sign.lua;


            # Override Content-Type based on file extension (MinIO stores as binary/octet-stream)
            header_filter_by_lua_block {
                local key = ngx.var.key or ""
                local ext = key:match("%.([^%.]+)$")
                if ext then
                    ext = ext:lower()
                    local types = {
                        jpg  = "image/jpeg",
                        jpeg = "image/jpeg",
                        png  = "image/png",
                        gif  = "image/gif",
                        tif  = "image/tiff",
                        tiff = "image/tiff",
                        pdf  = "application/pdf",
                    }
                    if types[ext] then
                        ngx.header["Content-Type"] = types[ext]
                    end
                end
            }

            # Do not forward dn/disp query args to MinIO
            proxy_pass $s3_scheme://$s3_host:$s3_port/$bucket/$key;
        }

        location / {
            # --- CrowdSec AppSec (in-band WAF, FAIL-OPEN) via lua ---
            # openresty auth_request drops sub-request headers, so call AppSec in lua
            # with explicit headers. Only an explicit 403 blocks; any error/timeout
            # allows the request (fail-open) so AppSec can never take the site down.
            access_by_lua_block {
                local httpc = require("resty.http").new()
                httpc:set_timeout(3000)
                local res = httpc:request_uri((os.getenv("CROWDSEC_APPSEC_URL") or "http://172.18.0.1:7422/"), {
                    method = "GET",
                    headers = {
                        ["X-Crowdsec-Appsec-Api-Key"] = (os.getenv("CROWDSEC_APPSEC_KEY") or ""),
                        ["X-Crowdsec-Appsec-Ip"]   = ngx.var.remote_addr,
                        ["X-Crowdsec-Appsec-Host"] = ngx.var.host,
                        ["X-Crowdsec-Appsec-Uri"]  = ngx.var.request_uri,
                        ["X-Crowdsec-Appsec-Verb"] = ngx.var.request_method,
                    },
                })
                if res and res.status == 403 then
                    return ngx.exit(403)
                end
            }
            add_header 'Access-Control-Allow-Origin' $cors_header always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            # Two-zone rate limiting: thumbnails get generous limits,
            # full-size images get stricter limits.
            # Both zones apply to every request; thumbnails have an empty key
            # in fullsize_zone so they're only governed by thumb_zone.
            limit_req zone=thumb_zone burst=120 nodelay;
            limit_req zone=fullsize_zone burst=5 nodelay;

            try_files $uri @image-server;
        }

        location @image-server {
            uwsgi_pass image-server:29000;
            include /usr/local/openresty/nginx/conf/uwsgi_params;
            uwsgi_param Host $host;
            uwsgi_param X-Real-IP $remote_addr;
            uwsgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
            uwsgi_param X-Forwarded-Proto $http_x_forwarded_proto;
            uwsgi_param X-Request-Id $request_id;

            # Allow Bottle to trigger internal redirects (NEW)
            uwsgi_pass_header X-Accel-Redirect;
            uwsgi_pass_header Content-Disposition;
            uwsgi_pass_header Content-Type;
        }
    }
}
